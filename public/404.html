<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Ashen Hansaka</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>

    <!-- Bootstrap Icons -->
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css"  rel="stylesheet" />
    <link href="assets/css/utils.css"  rel="stylesheet" />

    <style>
      :root {
        --bg-color: #ebebeb;
        --default-color: #31344b;
        --accent-color: #31344b;
        --box-shadow: 8px 8px 16px #c2c2c2, -8px -8px 16px #e7e3ff;
        --box-shadow-inset:
          inset 6px 6px 12px #c2c2c2, inset -6px -6px 12px #e7e3ff;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--default-color);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
      }

      .error-container {
        text-align: center;
        max-width: 600px;
        padding: 50px 40px;
        background-color: var(--bg-color);
        border-radius: 32px;
        box-shadow: var(--box-shadow);
      }

      .error-code {
        font-size: 7rem;
        font-weight: 800;
        color: var(--bg-color);
        text-shadow:
          3px 3px 5px #b8b8b8,
          -3px -3px 5px #ffffff;
        line-height: 1;
        margin-bottom: 20px;
        letter-spacing: 2px;
      }

      .error-title {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 1rem;
        color: #666;
        line-height: 1.6;
        margin-bottom: 35px;
      }

      .back-home-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 35px;
        background-color: var(--bg-color);
        color: var(--default-color);
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        border-radius: 12px;
        box-shadow: var(--box-shadow);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .back-home-btn:hover {
        box-shadow: var(--box-shadow-inset);
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <!-- Big 3D 404 Text -->
      <div class="error-code">404</div>

      <!-- Witty Message matching your profile -->
      <h1 class="error-title">Lost in Transit? ☕📍</h1>
      <p class="error-message">
        Even a Google Local Guide can't find this page, and honestly, it looks
        like this link was brewed worse than bad espresso. Let's get you back on
        track!
      </p>

      <!-- Back to Home Button -->
      <a href="https://ashenhansaka.com/" class="back-home-btn" data-ripple="true">
        <i class="bi bi-house-fill"></i> Back to Home
      </a>
    </div>

    <script src="assets/js/utils.js"></script>
  </body>
</html>
